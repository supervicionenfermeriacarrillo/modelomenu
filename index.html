<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexo Digital Posadas - Menú Digital</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f8f9fa; margin: 0; padding: 15px; color: #333; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
        h1 { text-align: center; color: #2c3e50; font-size: 24px; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #7f8c8d; font-size: 14px; margin-bottom: 20px; }
        
        .category-title { color: #2980b9; border-bottom: 2px solid #ecf0f1; padding-bottom: 5px; margin-top: 25px; font-size: 18px; }
        
        .product-card { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f1f1f1; }
        .product-info { flex-grow: 1; padding-right: 10px; }
        .product-name { font-weight: bold; font-size: 16px; color: #2c3e50; }
        .product-desc { font-size: 13px; color: #666; margin: 4px 0; }
        .product-price { font-weight: bold; color: #27ae60; font-size: 15px; }
        
        .product-actions { display: flex; align-items: center; gap: 8px; }
        button.add-btn { background: #27ae60; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; }
        button.add-btn:hover { background: #219653; }

        /* Carrito flotante / sección inferior */
        .cart-section { margin-top: 30px; background: #fdfefe; border: 1px solid #e2e8f0; padding: 15px; border-radius: 8px; }
        .cart-item { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; border-bottom: 1px dashed #eee; padding-bottom: 4px; }
        .total-container { font-size: 18px; font-weight: bold; text-align: right; margin-top: 15px; color: #2c3e50; }
        
        .form-group { margin-top: 15px; text-align: left; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input[type="text"], input[type="tel"] { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
        
        button.whatsapp-btn { background: #25d366; color: white; border: none; width: 100%; padding: 12px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; display: flex; justify-content: center; align-items: center; gap: 8px; }
        button.whatsapp-btn:hover { background: #20ba5a; }
        
        .loading { text-align: center; color: #888; padding: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Nexo Digital Posadas</h1>
    <div class="subtitle">Menú Online</div>

    <div id="menu-container" class="loading">Cargando menú...</div>

    <!-- Sección del Pedido / Carrito -->
    <div class="cart-section">
        <h3>Tu Pedido</h3>
        <div id="cart-items">
            <p style="color: #888; font-size: 14px; text-align: center;">No hay productos seleccionados.</p>
        </div>

        <div style="margin-top: 15px; border-top: 1px solid #ddd; padding-top: 10px;">
            <label style="font-weight: bold; display: block; margin-bottom: 8px;">Tipo de Entrega:</label>
            
            <label style="display: block; margin-bottom: 6px; cursor: pointer; font-weight: normal;">
                <input type="radio" name="tipoEntrega" value="llevar" checked onchange="actualizarTotales()"> 
                Para llevar
            </label>

            <label style="display: block; cursor: pointer; font-weight: normal;">
                <input type="radio" name="tipoEntrega" value="envio" onchange="actualizarTotales()"> 
                Envío a domicilio
            </label>
            <div id="texto-envio" style="font-size: 13px; color: #e67e22; font-weight: bold; margin-top: 3px; margin-left: 20px; display: none;">
                Entrega por tan solo $ 2500
            </div>
        </div>

        <div class="form-group">
            <label>Tu Nombre:</label>
            <input type="text" id="cliente-nombre" placeholder="Ej: Juan Pérez">
        </div>

        <div class="form-group">
            <label>Teléfono / Celular:</label>
            <input type="tel" id="cliente-telefono" placeholder="Ej: 3764...">
        </div>

        <div id="total-text" class="total-container">Total: $ 0</div>

        <button class="whatsapp-btn" onclick="enviarPedidoWhatsApp()">
            Enviar Pedido por WhatsApp
        </button>
    </div>
</div>

<script>
    // Conexión con Supabase usando tus credenciales
    const supabaseUrl = 'https://wlnwavthfnovmkrcpbwo.supabase.co';
    const supabaseKey = 'sb_publishable_fWfdhVMOO5sE0hYDoMuhDA_w-4O90X6';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    let carrito = [];
    let productosGlobal = [];

    async function cargarMenu() {
        const container = document.getElementById('menu-container');
        
        // Cargar categorías y productos desde Supabase
        const { data: categorias, error: errCat } = await _supabase.from('categorias').select('*');
        const { data: productos, error: errProd } = await _supabase.from('productos').select('*');

        if (errCat || errProd) {
            container.innerHTML = '<p style="color:red; text-align:center;">Error al cargar el menú.</p>';
            return;
        }

        productosGlobal = productos;
        container.innerHTML = '';

        categorias.forEach(cat => {
            // Filtrar productos de esta categoría que estén disponibles
            const prodsCat = productos.filter(p => p.categoria_id === cat.id && p.disponible !== false);
            
            if (prodsCat.length > 0) {
                let catDiv = document.createElement('div');
                catDiv.innerHTML = `<div class="category-title">${cat.nombre}</div>`;
                
                prodsCat.forEach(prod => {
                    let prodDiv = document.createElement('div');
                    prodDiv.className = 'product-card';
                    prodDiv.innerHTML = `
                        <div class="product-info">
                            <div class="product-name">${prod.nombre}</div>
                            <div class="product-desc">${prod.descripcion || ''}</div>
                            <div class="product-price">$ ${prod.precio}</div>
                        </div>
                        <div class="product-actions">
                            <button class="add-btn" onclick="agregarAlCarrito(${prod.id})">+</button>
                        </div>
                    `;
                    catDiv.appendChild(prodDiv);
                });
                container.appendChild(catDiv);
            }
        });
    }

    function agregarAlCarrito(id) {
        const producto = productosGlobal.find(p => p.id === id);
        if (!producto) return;

        let itemEnCarrito = carrito.find(item => item.id === id);
        if (itemEnCarrito) {
            itemEnCarrito.cantidad += 1;
        } else {
            carrito.push({ ...producto, cantidad: 1 });
        }
        renderizarCarrito();
    }

    function cambiarCantidad(id, cantidad) {
        let item = carrito.find(i => i.id === id);
        if (item) {
            item.cantidad += cantidad;
            if (item.cantidad <= 0) {
                carrito = carrito.filter(i => i.id !== id);
            }
        }
        renderizarCarrito();
    }

    function actualizarTotales() {
        const tipo = document.querySelector('input[name="tipoEntrega"]:checked').value;
        const textoEnvio = document.getElementById('texto-envio');
        
        if (tipo === 'envio') {
            textoEnvio.style.display = 'block';
        } else {
            textoEnvio.style.display = 'none';
        }
        renderizarCarrito();
    }

    function renderizarCarrito() {
        const cartContainer = document.getElementById('cart-items');
        const totalText = document.getElementById('total-text');

        if (carrito.length === 0) {
            cartContainer.innerHTML = '<p style="color: #888; font-size: 14px; text-align: center;">No hay productos seleccionados.</p>';
            totalText.innerText = 'Total: $ 0';
            return;
        }

        cartContainer.innerHTML = '';
        let subtotal = 0;

        carrito.forEach(item => {
            let sub = item.precio * item.cantidad;
            subtotal += sub;

            let div = document.createElement('div');
            div.className = 'cart-item';
            div.innerHTML = `
                <span>${item.nombre} (x${item.cantidad})</span>
                <span>$ ${sub} 
                    <button onclick="cambiarCantidad(${item.id}, -1)" style="margin-left:5px; background:#e74c3c; color:white; border:none; border-radius:3px; cursor:pointer; padding: 1px 5px;">-</button>
                    <button onclick="cambiarCantidad(${item.id}, 1)" style="background:#27ae60; color:white; border:none; border-radius:3px; cursor:pointer; padding: 1px 5px;">+</button>
                </span>
            `;
            cartContainer.appendChild(div);
        });

        const tipo = document.querySelector('input[name="tipoEntrega"]:checked').value;
        let costoEnvio = (tipo === 'envio') ? 2500 : 0;
        let totalFinal = subtotal + costoEnvio;

        if (costoEnvio > 0) {
            let envioDiv = document.createElement('div');
            envioDiv.className = 'cart-item';
            envioDiv.style.color = '#e67e22';
            envioDiv.innerHTML = `<span>Envío a domicilio</span><span>$ 2500</span>`;
            cartContainer.appendChild(envioDiv);
        }

        totalText.innerText = `Total: $ ${totalFinal}`;
    }

    function enviarPedidoWhatsApp() {
        if (carrito.length === 0) {
            alert('Por favor selecciona al menos un producto para tu pedido.');
            return;
        }

        const nombre = document.getElementById('cliente-nombre').value.trim();
        const telefono = document.getElementById('cliente-telefono').value.trim();

        if (!nombre || !telefono) {
            alert('Por favor completa tu Nombre y Teléfono antes de enviar el pedido.');
            return;
        }

        const tipoEntregaSelect = document.querySelector('input[name="tipoEntrega"]:checked').value;
        const tipoEntregaTexto = tipoEntregaSelect === 'envio' ? 'Envío a domicilio' : 'Para llevar';

        let mensaje = `*¡Hola! Quiero hacer un pedido:*%0A%0A`;
        mensaje += `*Tipo de Entrega:* ${tipoEntregaTexto}%0A`;
        mensaje += `*Nombre:* ${nombre}%0A`;
        mensaje += `*Teléfono:* ${telefono}%0A%0A`;
        mensaje += `*Detalle:*%0A`;

        let subtotal = 0;
        carrito.forEach(item => {
            let sub = item.precio * item.cantidad;
            subtotal += sub;
            mensaje += `- ${item.cantidad}x ${item.nombre} ($ ${sub})%0A`;
        });

        let costoEnvio = (tipoEntregaSelect === 'envio') ? 2500 : 0;
        if (costoEnvio > 0) {
            mensaje += `- Envío a domicilio: $ 2500%0A`;
        }

        let totalFinal = subtotal + costoEnvio;
        mensaje += `%0A*TOTAL A PAGAR: $ ${totalFinal}*`;

        // Reemplaza el número de abajo con tu número de WhatsApp de Posadas (con código de país y área, ej: 5493764XXXXXX)
        const numeroWhatsApp = '5493764561004'; 

        window.open(`https://wa.me/${numeroWhatsApp}?text=${mensaje}`, '_blank');
    }

    // Inicializar cargando el menú al abrir la página
    cargarMenu();
</script>

</body>
</html>
